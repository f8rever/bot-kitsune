<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>League of Legends SENDER</title>
    <link rel="stylesheet" href="/static/bootstrap/css/bootstrap.css">
    <link rel="stylesheet" href="/static/style.css?v=13.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@600;700;800;900&display=swap" rel="stylesheet">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22%23ffffff%22><path d=%22M13.458.86 0 7.093l3.353 12.761 2.552-.313-.701-8.024.838-.373 1.447 8.202 4.361-.535-.775-8.857.83-.37 1.591 9.025 4.412-.542-.849-9.708.84-.374 1.74 9.87L24 17.318V3.5Zm.316 19.356.222 1.256L24 23.14v-4.18l-10.22 1.256Z%22/></svg>">
    <script src="/static/api_hcaptcha.js" async defer></script>
    <style>
        :root {
            --bg-color: #040406;
            --card-bg: rgba(10, 11, 15, 0.88);
            --primary-silver: #cbd5e1;
            --primary-light: #f8fafc;
            --white: #ffffff;
            --gray-text: #94a3b8;
        }

        @keyframes rimLaserSweep {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }

        @keyframes liquidChromeSheen {
            0% { transform: translateX(-150%) skewX(-22deg); }
            42%, 100% { transform: translateX(250%) skewX(-22deg); }
        }

        body {
            margin: 0;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: #040406;
            background-image:
                radial-gradient(ellipse 80% 45% at 50% -10%, rgba(255, 255, 255, 0.12) 0%, rgba(148, 163, 184, 0.04) 48%, transparent 75%),
                radial-gradient(circle at 15% 80%, rgba(226, 232, 240, 0.06) 0%, transparent 50%),
                radial-gradient(circle at 85% 20%, rgba(148, 163, 184, 0.06) 0%, transparent 45%);
            overflow: hidden;
            font-family: 'Plus Jakarta Sans', 'Inter', sans-serif;
            color: var(--white);
        }

        #tsparticles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .monarch-login-card {
            background: var(--card-bg);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-radius: 22px;
            padding: 2px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.92), 0 0 30px rgba(255, 255, 255, 0.07);
            position: relative;
            overflow: hidden;
            z-index: 10;
            text-align: center;
            transition: transform 0.35s ease, box-shadow 0.35s ease;
        }

        .monarch-login-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 30px 70px rgba(0, 0, 0, 0.95), 0 0 40px rgba(255, 255, 255, 0.15);
        }

        .monarch-border-fx {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            border-radius: 22px;
            padding: 2px;
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
            z-index: 1;
        }

        .monarch-border-fx::before,
        .monarch-border-fx::after {
            content: '';
            position: absolute;
            top: -50%; left: -50%; width: 200%; height: 200%;
            background: conic-gradient(from 0deg, #ffffff 0deg, #94a3b8 18deg, transparent 45deg, transparent 315deg, #94a3b8 342deg, #ffffff 360deg);
        }

        .monarch-border-fx::before {
            animation: spinRight 2.2s ease-in-out infinite alternate;
        }

        .monarch-border-fx::after {
            animation: spinLeft 2.2s ease-in-out infinite alternate;
        }

        @keyframes spinRight {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(180deg); }
        }

        @keyframes spinLeft {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(-180deg); }
        }

        .monarch-login-card-content {
            background: transparent;
            border-radius: 20px;
            padding: 46px 38px;
            position: relative;
            z-index: 2;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .login-title {
            font-family: 'Outfit', sans-serif;
            font-size: 1.7rem;
            font-weight: 900;
            background: linear-gradient(180deg, #ffffff 0%, #cbd5e1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 2px;
            margin-bottom: 4px;
            text-transform: uppercase;
            line-height: 1.15;
            white-space: nowrap;
        }

        .login-title span {
            font-size: 2.25rem;
            background: linear-gradient(90deg, #94a3b8 0%, #ffffff 50%, #94a3b8 100%);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: rimLaserSweep 4.5s linear infinite;
            letter-spacing: 3.5px;
            display: inline-block;
        }

        .login-subtitle {
            font-size: 0.82rem;
            color: var(--gray-text);
            margin-top: 4px;
            margin-bottom: 36px;
            text-transform: uppercase;
            letter-spacing: 2.5px;
            font-weight: 600;
        }

        .input-group-custom {
            position: relative;
            margin-bottom: 20px;
            text-align: left;
            width: 100%;
        }

        .input-group-custom label {
            display: block;
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--gray-text);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper i {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--gray-text);
            font-size: 1.02rem;
            z-index: 2;
            transition: all 0.3s ease;
        }

        .input-wrapper input {
            width: 100%;
            background: rgba(5, 6, 9, 0.92) !important;
            border: 1px solid rgba(255, 255, 255, 0.14) !important;
            color: var(--white) !important;
            border-radius: 12px !important;
            padding: 15px 20px 15px 48px !important;
            font-size: 0.95rem !important;
            font-weight: 500 !important;
            font-family: 'Plus Jakarta Sans', 'Inter', sans-serif !important;
            transition: all 0.25s ease !important;
            outline: none !important;
            box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.85) !important;
        }

        .input-wrapper input::placeholder {
            color: #525b6c !important;
        }

        .input-wrapper input:focus {
            border-color: #ffffff !important;
            background: rgba(10, 12, 16, 0.98) !important;
            box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.15), 0 0 18px rgba(255, 255, 255, 0.15) !important;
        }

        .input-wrapper input:focus + i, 
        .input-wrapper input:focus ~ i {
            color: #ffffff !important;
        }

        .btn-login-submit {
            width: 100%;
            background: linear-gradient(180deg, #ffffff 0%, #e2e8f0 50%, #94a3b8 100%) !important;
            color: #050507 !important;
            border: 1px solid #ffffff !important;
            border-radius: 12px !important;
            font-family: 'Outfit', 'Inter', sans-serif !important;
            font-weight: 900 !important;
            font-size: 1rem !important;
            letter-spacing: 0.8px !important;
            text-transform: uppercase !important;
            padding: 15px !important;
            cursor: pointer !important;
            transition: all 0.25s cubic-bezier(0.2, 0.8, 0.2, 1) !important;
            margin-top: 14px !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            gap: 10px !important;
            position: relative !important;
            overflow: hidden !important;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.7), 0 0 20px rgba(255, 255, 255, 0.22), inset 0 1px 0 #ffffff !important;
        }

        .btn-login-submit::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 45%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.85), transparent);
            transform: translateX(-150%) skewX(-22deg);
            animation: liquidChromeSheen 4.2s infinite ease-in-out;
            pointer-events: none;
        }

        .btn-login-submit:hover {
            background: linear-gradient(180deg, #ffffff 0%, #f8fafc 65%, #cbd5e1 100%) !important;
            color: #000000 !important;
            transform: translateY(-2px) !important;
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.55), 0 10px 26px rgba(0, 0, 0, 0.8) !important;
        }

        .btn-login-submit:active {
            transform: translateY(1px) !important;
        }

        .error-message {
            color: #ffffff;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.45);
            font-size: 0.85rem;
            margin-top: 15px;
            min-height: 20px;
            font-weight: 700;
        }

        .discord-login-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            color: #cbd5e1;
            text-decoration: none;
            font-family: 'Plus Jakarta Sans', 'Inter', sans-serif;
            font-weight: 600;
            font-size: 0.84rem;
            margin-top: 22px;
            padding: 8px 18px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.16);
            transition: all 0.25s ease;
        }

        .discord-login-btn i {
            color: #ffffff;
            font-size: 1.1rem;
        }

        .discord-login-btn:hover {
            color: #050507;
            background: linear-gradient(180deg, #ffffff 0%, #cbd5e1 100%);
            border-color: #ffffff;
            box-shadow: 0 0 18px rgba(255, 255, 255, 0.4);
            transform: translateY(-1px);
        }

        .discord-login-btn:hover i {
            color: #050507;
        }
    </style>
</head>
<body>
    <div id="tsparticles"></div>

    <!-- LEAGUE OF LEGENDS SENDER LOGIN CARD (ALWAYS ENGLISH) -->
    <div class="monarch-login-card">
        <div class="monarch-border-fx"></div>

        <div class="monarch-login-card-content">
            <h1 class="login-title">League of Legends<br><span>Sender</span></h1>
            <div class="login-subtitle">Gifting System</div>

            <form onsubmit="event.preventDefault(); login();" style="width: 100%;">
                <div class="input-group-custom">
                    <label>Username</label>
                    <div class="input-wrapper">
                        <input type="text" id="login_api" placeholder="Enter your username" autocomplete="off" required>
                        <i class="fa-solid fa-user"></i>
                    </div>
                </div>
                <div class="input-group-custom">
                    <label>License Key</label>
                    <div class="input-wrapper">
                        <input type="password" id="key_api" placeholder="Enter your license key" autocomplete="new-password" required>
                        <i class="fa-solid fa-key"></i>
                    </div>
                </div>
                <button type="button" class="btn-login-submit" id="btn-login-submit" onclick="login()">
                    Login <i class="fa-solid fa-arrow-right ms-1"></i>
                </button>
            </form>

            <div class="error-message" id="error-message"></div>

            <a href="https://discord.gg/nQAk7jtWpG" target="_blank" class="discord-login-btn" id="discord-login-btn">
                <i class="fab fa-discord"></i> Join our Discord community
            </a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/tsparticles@2/tsparticles.bundle.min.js"></script>
    <script>
        tsParticles.load("tsparticles", {
            background: { color: { value: "transparent" } },
            fpsLimit: 60,
            particles: {
                number: { value: 65, density: { enable: true, area: 900 } },
                color: { value: ["#ffffff", "#e2e8f0", "#cbd5e1", "#94a3b8"] },
                shape: { type: "circle" },
                opacity: {
                    value: { min: 0.18, max: 0.72 },
                    animation: { enable: true, speed: 1.2, minimumValue: 0.15, sync: false }
                },
                size: {
                    value: { min: 1.2, max: 3.2 },
                    animation: { enable: true, speed: 1.8, minimumValue: 0.8, sync: false }
                },
                links: {
                    enable: true,
                    distance: 145,
                    color: "#cbd5e1",
                    opacity: 0.18,
                    width: 1
                },
                move: {
                    enable: true,
                    speed: 0.65,
                    direction: "none",
                    random: true,
                    straight: false,
                    outModes: { default: "bounce" }
                }
            },
            interactivity: {
                events: {
                    onHover: { enable: true, mode: "grab" },
                    onClick: { enable: true, mode: "push" },
                    resize: true
                },
                modes: {
                    grab: {
                        distance: 185,
                        links: { opacity: 0.55, color: "#ffffff" }
                    },
                    push: { quantity: 3 }
                }
            },
            detectRetina: true
        });
    </script>
    <script src="../static/script.js?v=13.0"></script>
    <script>
        localStorage.removeItem('jwtToken');
        sessionStorage.clear();
    </script>
</body>
</html>
